name: Scientific checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts data/reproduce.py
      - run: python -m pytest -q
      - run: python data/reproduce.py
      - run: python data/calibrated-v2/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser-acquisition.mjs tests/browser-validation.mjs tests/browser-edge.mjs
      - run: python scripts/verify_edge_core.py --output /tmp/edge-core
      - run: instrumentzero edge simulate --scenario mount_b --seconds 4 --export /tmp/edge-mount-b.zip
      - run: python scripts/validate_replay.py --output /tmp/recorded-replay
      - run: instrumentzero validate-calibrated --export /tmp/calibrated-evidence.zip
      - run: python scripts/validate_real.py --output /tmp/validation
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cd /tmp && instrumentzero demo stiffness
      - run: cd /tmp && instrumentzero edge simulate --scenario silence --seconds 4
      - uses: actions/upload-artifact@v4
        with:
          name: package-python-${{ matrix.python }}
          path: dist/*
