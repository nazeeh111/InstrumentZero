<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="570" viewBox="0 0 1320 570" role="img" aria-labelledby="title desc"><title id="title">InstrumentZero Edge architecture</title><desc id="desc">A typed measurement specification binds the provisional acquisition adapter, checked host and edge processing, and reproducible export. Physical reference verification is unavailable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#646e65"/></marker><style>text{fill:#222923;font-family:Arial,Helvetica,sans-serif}.label{font-size:12px;fill:#646e65;letter-spacing:1px}.name{font-size:18px}.small{font-size:13px;fill:#646e65}.box{fill:#fdfcf8;stroke:#d7dacf}.link{stroke:#646e65;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1320" height="570" fill="#f5f3ec"/><text x="40" y="38" class="label">INSTRUMENTZERO EDGE / SOFTWARE PREVIEW ARCHITECTURE</text><text x="40" y="78" font-family="Georgia,serif" font-size="33">One specification. Every stage.</text><rect x="40" y="105" width="400" height="76" class="box"/><text x="60" y="134" class="name">Typed graph + calibration identity</text><text x="60" y="159" class="small">Channels · units · rate · FIR · error/resource budgets</text><path d="M440 143H495" class="link"/><rect x="498" y="105" width="360" height="76" class="box"/><text x="518" y="134" class="name">Reviewed compiler + planner</text><text x="518" y="159" class="small">Measured host costs; MCU costs remain unknown</text><path d="M858 143H910" class="link"/><rect x="913" y="105" width="367" height="76" class="box"/><text x="933" y="134" class="name">Binding + configuration epoch</text><text x="933" y="159" class="small">Reject incompatible graphs, units and stale analysis</text><path d="M1096 181V214H140V244" class="link"/><rect x="40" y="246" width="1240" height="132" fill="#e9eddf" stroke="#d7dacf"/><text x="60" y="271" class="label">DATA PATH / PLACEMENT CUT MOVES BETWEEN REVIEWED STAGES</text><g><rect x="60" y="289" width="173" height="66" class="box"/><text x="76" y="315" class="name">Source</text><text x="76" y="338" class="small">Sensor · WAV · simulation</text><path d="M233 322H257" class="link"/><rect x="260" y="289" width="173" height="66" class="box"/><text x="276" y="315" class="name">Validate</text><text x="276" y="338" class="small">Clock · sequence · CRC</text><path d="M433 322H457" class="link"/><rect x="460" y="289" width="173" height="66" class="box"/><text x="476" y="315" class="name">Calibrate</text><text x="476" y="338" class="small">Signed per-axis gains</text><path d="M633 322H657" class="link"/><rect x="660" y="289" width="173" height="66" class="box"/><text x="676" y="315" class="name">Filter / reduce</text><text x="676" y="338" class="small">Continuous-state C FIR</text><path d="M833 322H857" class="link"/><rect x="860" y="289" width="173" height="66" class="box"/><text x="876" y="315" class="name">Estimate</text><text x="876" y="338" class="small">Host ringdown + rejection</text><path d="M1033 322H1057" class="link"/><rect x="1060" y="289" width="200" height="66" class="box"/><text x="1076" y="315" class="name">Record + recompute</text><text x="1076" y="338" class="small">Raw data · source · manifest</text></g><rect x="40" y="408" width="598" height="104" class="box"/><text x="60" y="439" class="name">Provisional MCU: bounded acquisition and transport</text><text x="60" y="465" class="small">Driver thread → bounded queue → optional C prefix → IZP1 packets</text><text x="60" y="489" class="small">Explicit start, keepalive, synchronized stop. No device was flashed.</text><rect x="662" y="408" width="618" height="104" fill="#f7ecdf" stroke="#d9c8b8"/><text x="682" y="439" class="name">Physical verification remains open</text><text x="682" y="465" class="small">No available sensor setup, fresh remounts or independent physical reference.</text><text x="682" y="489" class="small">Simulation and another calculation on the same samples cannot close those gates.</text><text x="40" y="548" class="small">Editable graph: docs/edge/architecture.mmd  ·  Editable vector: this SVG  ·  Numerical reference: NumPy/SciPy float64</text></svg>
